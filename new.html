
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Shopping Mall | Premium Lifestyle</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <nav class="navbar">
        <div class="logo">Shopping Mall</div>
        <ul class="nav-links">
            <li><a href="#">Home</a></li>
            <li><a href="#">Shop</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
        <div class="cart-icon">
            <i class="fas fa-shopping-cart"></i>
            <span id="cart-count">0</span>
        </div>
    </nav>

    <header class="hero">
        <div class="hero-content">
            <h1>Elevate Your Style</h1>
            <p>Explore our curated collection of premium leather goods and signature scents.</p>
            <button class="btn-primary">Shop Now</button>
        </div>
    </header>

    <section class="products">
        <h2 class="section-title">Featured Products</h2>
        <div class="product-grid">
            <div class="product-card">
                <div class="product-image">
                    <img src="https://via.placeholder.com/250" alt="Leather Wallet">
                </div>
                <div class="product-info">
                    <h3>Classic Leather Wallet</h3>
                    <p class="price">$45.00</p>
                    <button class="add-to-cart">Add to Cart</button>
                </div>
            </div>

            <div class="product-card">
                <div class="product-image">
                    <img src="https://via.placeholder.com/250" alt="Signature Perfume">
                </div>
                <div class="product-info">
                    <h3>Signature Scent No. 1</h3>
                    <p class="price">$85.00</p>
                    <button class="add-to-cart">Add to Cart</button>
                </div>
            </div>

            <div class="product-card">
                <div class="product-image">
                    <img src="https://via.placeholder.com/250" alt="Leather Belt">
                </div>
                <div class="product-info">
                    <h3>Full-Grain Belt</h3>
                    <p class="price">$35.00</p>
                    <button class="add-to-cart">Add to Cart</button>
                </div>
            </div>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
